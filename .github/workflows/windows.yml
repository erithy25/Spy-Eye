name: windows

# The whole demonstration path on a Windows machine with Windows PowerShell 5.1, through the one
# command a presenter runs (vorfuehrung.cmd): install, build, fetch the footage, prepare three
# nodes, check them, restore them, play the exercise. It downloads about 1.3 GB, so it runs only
# when asked for: by hand, or by a commit whose message contains [windows].

on:
  workflow_dispatch:
  push:
    branches: ['**']

jobs:
  demo:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows]')
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: ffmpeg
        run: choco install ffmpeg --no-progress -y
      - uses: actions/cache@v4
        with:
          path: .models
          key: models-siglip2-base-patch32-256-v1
      # The one command a presenter runs, on a machine that has nothing yet: install, build, fetch
      # the footage, analyse it on three nodes, check them. Only the start itself is left out.
      - name: vorfuehrung.cmd on a fresh machine
        run: .\vorfuehrung.cmd -NurPruefen
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm selftest
      # The same command again, as after a rehearsal: it restores the prepared state and checks.
      - name: vorfuehrung.cmd on a prepared machine
        run: .\vorfuehrung.cmd -NurPruefen
      # The command without a switch: it starts the nodes. The console has to answer; then the
      # nodes are stopped the hard way, as closing the window would.
      - name: vorfuehrung.cmd starts the nodes
        run: |
          $p = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'vorfuehrung.cmd' -PassThru -NoNewWindow -RedirectStandardOutput start.log -RedirectStandardError start.err
          $ok = $false
          for ($i = 0; $i -lt 300; $i++) {
            # The preflight inside the command starts nodes of its own; only what answers after
            # the command has announced the start counts.
            $announced = (Test-Path start.log) -and (Select-String -Path start.log -Pattern 'Hauptbildschirm' -Quiet)
            if ($announced) {
              try {
                Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8787/api/public/info' -TimeoutSec 2 | Out-Null
                $ok = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            } else {
              Start-Sleep -Seconds 1
            }
          }
          Get-Content start.log -Tail 25
          taskkill /PID $p.Id /T /F | Out-Null
          Start-Sleep -Seconds 3
          if (-not $ok) { Get-Content start.err -Tail 25; Write-Host 'The console did not answer.'; exit 1 }
          Write-Host 'The console answered.'
          exit 0
      # Preparing twice must not change the starting point; the nodes are checked from it once more.
      - run: pnpm demo:prepare
      - run: pnpm demo:check
      # The same events and the same single false alert as on the development machine.
      - run: pnpm exercise:evaluate --speed 8 --require 13 --max-false 1
      # The ledger a node wrote here is checked by the two stand-alone verifiers.
      - run: pnpm ledger:verify data-koblenz/ledger.jsonl
      - run: python tools/pruefen/ledger_verify.py data-koblenz/ledger.jsonl
